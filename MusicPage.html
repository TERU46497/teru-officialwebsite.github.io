    ];


    /* =========================================================
    SFX CARDS
    ========================================================= */

    const sfxGrid = document.getElementById("sfxGrid");


    sfxList.forEach((sfx) => {

        const card = document.createElement("article");

        card.className = "sfx-card";


        card.innerHTML = `

            <h3 class="sfx-name">
                ${sfx.name}
            </h3>


            <p class="sfx-description">
                ${sfx.description}
            </p>


            <audio
                class="sfx-player"
                controls
                preload="none"
            >
                <source
                    src="${sfx.file}"
                    type="audio/wav"
                >
            </audio>


            <a
                href="${sfx.file}"
                download
                class="sfx-download"
            >
                ↓ ダウンロード
            </a>

        `;


        sfxGrid.appendChild(card);

    });


    /* =========================================================
    DROPDOWN
    ========================================================= */

    const sfxToggle =
        document.getElementById("sfxToggle");

    const sfxContainer =
        document.getElementById("sfxContainer");

    const sfxArrow =
        document.getElementById("sfxArrow");


    sfxToggle.addEventListener("click", () => {

        const isOpen =
            sfxContainer.classList.contains("open");


        if (isOpen) {

            sfxContainer.classList.remove("open");

            sfxArrow.textContent = "↓";

        } else {

            sfxContainer.classList.add("open");

            sfxArrow.textContent = "↑";

        }

    });
